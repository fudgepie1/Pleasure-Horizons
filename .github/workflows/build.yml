name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - uses: actions/checkout@v4

      # ⭐ FIX: Automatically flatten nested project folder
      - name: Flatten nested project folder
        run: |
          shopt -s dotglob
          for d in */; do
            if [ -f "$d/build.gradle" ]; then
              echo "Found nested project folder: $d"
              mv "$d"/* .
              rm -rf "$d"
              break
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          
      - name: Verify Gradle path
        run: echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"

      - name: Clear Gradle & Loom caches
        run: |
          rm -rf $GRADLE_USER_HOME/caches
          rm -rf $GRADLE_USER_HOME/loom-cache
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/loom-cache

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Check Yarn mapping version
        run: grep "yarn_mappings" gradle.properties

      - name: Force dependency refresh
        run: ./gradlew --refresh-dependencies

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
