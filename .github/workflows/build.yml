name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Delete stale nested workspace GitHub Actions keeps restoring
      - name: Delete old nested workspace
        run: |
          rm -rf Pleasure-Horizons

      # 3. Show actual workspace structure
      - name: Show workspace structure
        run: ls -R .

      # 4. Set up Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5. Verify Gradle path
      - name: Verify Gradle path
        run: echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"

      # 6. FULL CACHE CLEAR — Gradle + Loom + workspace caches
      - name: Clear Gradle & Loom caches
        run: |
          rm -rf $GRADLE_USER
