name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Delete ALL stale nested workspaces GitHub Actions keeps restoring
      #    GitHub Actions truncates "-1" in printed paths, so the actual folder is "Pleasure-Horizons"
      - name: Delete old nested workspace
        run: |
          rm -rf Pleasure-Horizons
          rm -rf ${{ github.workspace }}/Pleasure-Horizons
          rm -rf ${{ github.workspace }}/Pleasure-Horizons/Pleasure-Horizons

      # 3. Show actual workspace structure
      - name: Show workspace structure
        run: ls -R ${{ github.workspace }}

      # 4. Set up Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5. Verify Gradle path
      - name: Verify Gradle path
        run: echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"

      # 6. FULL CACHE CLEAR — Gradle + Loom + workspace caches
      - name: Clear Gradle & Loom caches
        run: |
          rm -rf $GRADLE_USER_HOME/caches
          rm -rf $GRADLE_USER_HOME/loom-cache
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/loom-cache
          rm -rf ${{ github.workspace }}/.gradle/caches
          rm -rf ${{ github.workspace }}/.gradle/loom-cache

      # 7. Diagnostic: Show where Loom is loading mappings + Unpick metadata
      - name: Show Loom mapping source
        run: |
          echo "=== Searching workspace for Yarn/Unpick ==="
          find ${{ github.workspace }} -type f -name "*yarn*" -print
          find ${{ github.workspace }} -type f -name "*unpick*" -print

          echo "=== Searching GRADLE_USER_HOME for Yarn/Unpick ==="
          find $GRADLE_USER_HOME -type f -name "*yarn*" -print
          find $GRADLE_USER_HOME -type f -name "*unpick*" -print

          echo "=== Searching ~/.gradle for Yarn/
