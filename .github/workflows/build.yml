name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      # 0. Delete stale workspace BEFORE checkout
      #    This is the critical fix: checkout recreates the stale folder if we don't delete it first.
      - name: Delete stale runner workspace
        run: |
          rm -rf /home/runner/work/Pleasure-Horizons
          rm -rf ${{ github.workspace }}/Pleasure-Horizons
          rm -rf ${{ github.workspace }}/Pleasure-Horizons/Pleasure-Horizons

      # 1. Checkout repository (now into a clean workspace)
      - uses: actions/checkout@v4

      # 2. Show actual workspace structure
      - name: Show workspace structure
        run: ls -R ${{ github.workspace }}

      # 3. Set up Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Verify Gradle path
      - name: Verify Gradle path
        run: echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"

      # 5. FULL CACHE CLEAR — Gradle + Loom + workspace caches
      - name: Clear Gradle & Loom caches
        run: |
          rm -rf $GRADLE_USER_HOME/caches
          rm -rf $GRADLE_USER_HOME/loom-cache
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/loom-cache
          rm -rf ${{ github.workspace }}/.gradle/caches
          rm -rf ${{ github.workspace }}/.gradle/loom-cache

      # 6. Diagnostic: Show where Loom is loading mappings + Unpick metadata
      - name: Show Loom mapping source
        run: |
          echo "=== Searching workspace for Yarn/Unpick ==="
          find ${{ github.workspace }} -type f -name "*yarn*" -print
          find ${{ github.workspace }} -type f -name "*unpick*" -print

          echo "=== Searching GRADLE_USER_HOME for Yarn/Unpick ==="
          find /home/runner/work/Pleasure-Horizons/.gradle -type f -name "*yarn*" -print || echo "No yarn files"
          find /home/runner/work/Pleasure-Horizons/.gradle -type f -name "*unpick*" -print || echo "No unpick files"

          echo "=== Searching ~/.gradle for Yarn/Unpick ==="
          if [ -d ~/.gradle ]; then
            find ~/.gradle -type f -name "*yarn*" -print
            find ~/.gradle -type f -name "*unpick*" -print
          else
            echo "~/.gradle does not exist"
          fi

      # 7. Make Gradle executable
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 8. Show Yarn mapping version
      - name: Check Yarn mapping version
        run: grep "yarn_mappings" gradle.properties || echo "gradle.properties not found"

      # 9. Force dependency refresh
      - name: Force dependency refresh
        run: ./gradlew --refresh-dependencies

      # 10. Build mod
      - name: Build with Gradle
        run: ./gradlew build --stacktrace

